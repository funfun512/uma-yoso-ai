services:
  - type: web
    name: uma-yoso-ai
    runtime: python
    buildCommand: pip install Flask==3.1.2 flask-cors==6.0.1 requests==2.32.5 beautifulsoup4==4.14.2 gunicorn==23.0.0
    startCommand: gunicorn app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5